name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libcurl4-openssl-dev libssl-dev zlib1g-dev llvm-dev

      - name: Build
        run: make -j"$(nproc)"

      - name: Test (runtime self-test + both-backend regression)
        run: make

      # Deterministic performance counters only: allocations and collection
      # resizes are runtime telemetry, so they are machine-independent.
      # Absolute wall clock is gated on the pinned machine instead
      # (benchmarks/gate.sh, full tier) — a wall-clock gate on a shared
      # runner would fail on noise and teach everyone to ignore it.
      - name: Performance regression gate (heap counters)
        run: bash benchmarks/gate.sh --tier heap --reps 3

      - name: Run the examples
        run: make examples

      - name: Smoke-test `ovc init`
        run: |
          work="$(mktemp -d)"
          cd "$work"
          "$GITHUB_WORKSPACE/build/ovc" init demo
          cd demo
          "$GITHUB_WORKSPACE/build/ovc" run main.ov
          make build OVC="$GITHUB_WORKSPACE/build/ovc"
          ./build/app

      - name: Install into a prefix and compile from there
        run: |
          ./install.sh "$HOME/.local"
          export PATH="$HOME/.local/bin:$PATH"
          work="$(mktemp -d)"
          cd "$work"
          ovc init installed
          ovc installed/main.ov -o installed_app
          ./installed_app
